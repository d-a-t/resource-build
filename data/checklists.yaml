shopping:
  - Fresh skinless chicken breasts, turkey, or beef (freeze or cook day of purchase)
  - Long-grain jasmine rice, rolled oats, sweet potatoes, and russet potatoes
  - Carrots, zucchini, broccoli, and cucumbers (fresh or plain frozen)
  - Fresh Gala/Fuji apples, Bartlett pears, or blueberries
  - Extra virgin olive oil, pure salt, fresh garlic, onion, and fresh herbs
  - Freezer-safe quart bags (flat freezing for dorm mini-fridges) and Sharpie marker
  - Microwave-safe ceramic bowl or glass dish with cover (dorm cooking staple)
meal_prep:
  - Cook meals in single or double portions; never leave food sitting on warmers
  - Portion and freeze hot meals within 60 minutes to stop histamine synthesis
  - Write dish name and date on each bag with a Sharpie
  - Stack flat bags horizontally in dorm mini-fridge freezer compartment
  - Reheat single portions directly from frozen in the microwave
  - Strictly omit tomato paste, red/balsamic vinegar, aged cheese, and store-bought bouillon
  - Communicate with roommates to designate a dedicated "freezer shelf" in communal kitchens
