shopping:
  - Fresh chicken, turkey, or beef, to cook or freeze the day you buy it
  - Rice, oats, potatoes, and sweet potatoes
  - Carrots, zucchini, broccoli, and seasonal vegetables
  - Apples, pears, or blueberries
  - Olive oil, salt, fresh garlic and onion, fresh herbs
  - Freezer-safe containers or bags, and a marker for dates
meal_prep:
  - Cook in batches and portion right away
  - Freeze portions within about an hour of cooking
  - Label each portion with the date
  - Reheat single portions from frozen
  - Skip tomato sauce, vinegar, store-bought broth, and cured meats
