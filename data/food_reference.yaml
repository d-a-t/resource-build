          notes: Citrus is a histamine liberator; use small amounts if tolerated

    - name: Teas & Infusions
      items:
        - name: Fresh herbal tea
          status: safer
          attributes: [herbal tea, soothing, botanical, caffeine-free]
          notes: Chamomile, peppermint, lemongrass, dandelion root
        - name: Black tea
          status: caution
          attributes: [tea, caffeinated, fermented, astringent, DAO-blocker]
          notes: Fermented tea leaves inhibit DAO enzyme and contain caffeine
        - name: Green tea
          status: caution
          attributes: [tea, caffeinated, antioxidant, DAO-blocker]
          notes: Contains caffeine and tannins that can inhibit DAO

    - name: Fresh Juices
      items:
        - name: Fresh juices of allowed fruits / vegetables
          status: safer
          attributes: [juice, fresh, hydrating, sweet]
          notes: Freshly pressed and consumed immediately

    - name: Coffee & Caffeinated Beverages
      items:
        - name: Coffee
          status: caution
          attributes: [coffee, caffeinated, bitter, acidic, DAO-blocker]
          notes: Caffeine can trigger histamine release and inhibit DAO

    - name: Alcoholic & Fermented Drinks
      items:
        - name: Alcohol (wine and beer)
          status: avoid
          attributes: [alcoholic, fermented, DAO-blocker, high-histamine]
          notes: Potent DAO enzyme blocker; fermented drinks carry high biogenic amines
        - name: Kombucha
          status: avoid
          attributes: [fermented, probiotic, tart, high-histamine]
          notes: Fermented tea with live yeast and bacteria, very high in histamine
        - name: Commercial canned or processed drinks
          status: avoid
          attributes: [processed, sugary, artificial, preservatives]
          notes: Sodas, energy drinks, and bottled sweetened teas with preservatives

