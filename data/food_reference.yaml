          status: safer
          attributes: [water, hydrating, neutral, zero-histamine]
        - name: Mineral water (plain or carbonated)
          status: safer
          attributes: [water, mineral, sparkling, hydrating]
        - name: Coconut water
          status: safer
          attributes: [hydrating, sweet, electrolytes]
