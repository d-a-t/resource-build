# Food reference table with groups, subgroups, safety status, attributes, and notes.
# Edit freely. Verify each row against SIGHI before publishing.

- group: Meat and fish
  subgroups:
    - name: Poultry & Fowl
      items:
        - name: Chicken
          status: safer
          attributes: [poultry, lean meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Turkey
          status: safer
          attributes: [poultry, lean meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Duck
          status: safer
          attributes: [poultry, game, rich, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Goose
          status: safer
          attributes: [poultry, game, rich, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Quail
          status: safer
          attributes: [poultry, game, savory, protein]
          notes: Fresh or frozen un-aged

    - name: Red Meat & Game
      items:
        - name: Beef
          status: safer
          attributes: [red meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Lamb
          status: safer
          attributes: [red meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Pork
          status: safer
          attributes: [red meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Bison
          status: safer
          attributes: [red meat, game, lean meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Ostrich
          status: safer
          attributes: [red meat, game, lean meat, savory, protein]
          notes: Fresh or frozen un-aged
        - name: Rabbit
          status: safer
          attributes: [game, lean meat, savory, protein]
          notes: Fresh or frozen un-aged

    - name: Organ Meats
      items:
        - name: Liver
          status: safer
          attributes: [organ meat, nutrient-dense, savory, protein]
          notes: Fresh or frozen un-aged

    - name: Fish & Seafood
      items:
        - name: Salmon
          status: safer
          attributes: [fish, seafood, oily fish, savory, protein]
          notes: Gutted and frozen within minutes of catch
        - name: Fresh fish (uncooked after purchase day)
          status: caution
          attributes: [fish, seafood, protein]
          notes: Fresh fish not cooked the day it is bought
        - name: Canned fish
          status: avoid
          attributes: [fish, seafood, high-histamine, preserved]
          notes: Tuna, sardines, mackerel, etc.
        - name: Smoked fish
          status: avoid
          attributes: [fish, seafood, smoked, cured, high-histamine]
          notes: Smoked salmon, kippers, trout, etc.
        - name: Shellfish
          status: avoid
          attributes: [shellfish, seafood, histamine-liberator, high-histamine]
          notes: Shrimp, crab, lobster, mussels, oysters, clams

    - name: Processed & Leftover Meats
      items:
        - name: Leftover cooked meat
          status: caution
          attributes: [cooked meat, leftovers]
          notes: Histamine accumulates rapidly in refrigerated cooked meat; freeze immediately
        - name: Cured, smoked, or deli meats
          status: avoid
          attributes: [cured, smoked, processed meat, savory, high-sodium, high-histamine]
          notes: Salami, bacon, ham, hot dogs, cold cuts

- group: Eggs and dairy
  subgroups:
    - name: Eggs
      items:
        - name: Eggs (whole)
          status: safer
          attributes: [eggs, protein, fat]
          notes: If tolerated; yolks are generally safer than whites
        - name: Egg whites
          status: caution
          attributes: [eggs, protein, histamine-liberator]
          notes: Egg whites can act as histamine liberators in sensitive individuals

    - name: Dairy Fats & Butters
      items:
        - name: Butter
          status: safer
          attributes: [dairy, fat, savory, rich]
        - name: Grass-fed butter
          status: safer
          attributes: [dairy, fat, savory, rich]
        - name: Ghee (grass-fed)
          status: safer
          attributes: [dairy, fat, savory, rich, nutty]
          notes: Clarified butter; very low lactose and casein

    - name: Fresh Cheeses
      items:
        - name: Fresh cream cheese
          status: safer
          attributes: [dairy, fresh cheese, creamy, mild]
          notes: Uncultured/fresh, not aged
        - name: Fresh mozzarella
          status: safer
          attributes: [dairy, fresh cheese, creamy, mild]
          notes: Fresh in water, un-aged
        - name: Ricotta
          status: safer
          attributes: [dairy, fresh cheese, creamy, sweet]
          notes: Fresh un-aged whey cheese

    - name: Milks
      items:
        - name: A2 cow milk
          status: safer
          attributes: [dairy, milk, beverage, creamy]
          notes: Better tolerated than conventional A1 cow milk
        - name: Goat milk
          status: safer
          attributes: [dairy, milk, beverage, creamy]
        - name: Sheep milk
          status: safer
          attributes: [dairy, milk, beverage, rich]
        - name: Milk (conventional cow milk)
          status: caution
          attributes: [dairy, milk, beverage]
          notes: Conventional A1 milk; varies by person

    - name: Fermented & Aged Dairy
      items:
        - name: Yogurt
          status: caution
          attributes: [dairy, fermented, tart, probiotic]
          notes: Fermented product; histamine levels depend on culture strains
        - name: Aged cheeses
          status: avoid
          attributes: [dairy, aged cheese, fermented, savory, pungent, high-histamine]
          notes: Cheddar, parmesan, blue cheese, gouda, swiss; high histamine from microbial aging
        - name: Kefir
          status: avoid
          attributes: [dairy, fermented, tart, probiotic, beverage, high-histamine]
          notes: Fermented milk drink rich in histamine and yeasts
        - name: General unverified dairy
          status: avoid
          attributes: [dairy, processed]
          notes: General dairy not sourced as grass-fed/pasture-raised where specified

