id: rice-cooker-chicken-carrot-rice
title: Rice Cooker Chicken and Carrot Rice
description: A one-step dinner that cooks while you study.
servings: 1
prep_minutes: 10
cook_minutes: 25
cost_per_serving: 2.0
equipment:
- Rice cooker
ingredients:
- 1 cup rice
- 1 chicken breast, diced small
- 1 carrot, diced
- 1 tbsp olive oil
- Salt
- 1 clove fresh garlic
method:
- Add everything plus 2 cups water to the rice cooker.
- Start the cooker and wait until it switches to warm.
- Make sure the chicken is cooked through, then fluff and serve.
storage: Freeze individual portions right after cooking.
