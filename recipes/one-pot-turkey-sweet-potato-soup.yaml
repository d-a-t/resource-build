id: one-pot-turkey-sweet-potato-soup
title: One-Pot Turkey and Sweet Potato Soup
category: advanced
description: Makes four servings. Freezes well.
servings: 4
prep_minutes: 15
cook_minutes: 40
cost_per_serving: 1.66
equipment:
- Large pot
- Stove or hot plate
ingredients:
- 1 lb fresh ground turkey
- 3 sweet potatoes, cubed
- 2 carrots, sliced
- 1/2 onion
- 6 cups water
- Salt
- Fresh herbs
method:
- Simmer everything in water until the turkey is cooked through.
- Shred or break up the turkey and return it to the pot.
- Portion and freeze right away.
storage: Freeze in single portions right after cooking.
