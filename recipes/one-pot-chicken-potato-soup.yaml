id: one-pot-chicken-potato-soup
title: One-Pot Chicken and Potato Soup
category: basic
description: Makes four servings. Freezes well.
servings: 4
prep_minutes: 15
cook_minutes: 40
cost_per_serving: 1.75
equipment:
- Large pot
- Stove or hot plate
ingredients:
- 1 lb fresh chicken thighs or breasts
- 3 potatoes, cubed
- 2 carrots, sliced
- 1/2 onion
- 6 cups water
- Salt
- Fresh herbs
method:
- Simmer everything in water until the chicken is cooked through.
- Shred the chicken and return it to the pot.
- Portion and freeze right away.
storage: Freeze in single portions right after cooking.
tags:
- one-pot
- batch-cook
- freezer-friendly
notes: Use water, not store-bought broth, which is often high in histamine.
