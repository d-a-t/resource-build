id: veggie-fried-rice
title: Veggie Fried Rice (egg optional)
category: basic
servings: 1
prep_minutes: 10
cook_minutes: 10
cost_per_serving: 1.25
equipment:
- Skillet
ingredients:
- 1 1/2 cups freshly cooked rice
- 1 carrot, diced
- 1/2 zucchini, diced
- 1 egg (if tolerated)
- 1 tbsp olive oil
- Salt
method:
- Stir-fry the vegetables in oil.
- Add rice and salt.
- Push the rice aside and scramble in the egg, if using. Skip soy sauce.
storage: Best eaten fresh. Freeze extra portions right after cooking.
tags:
- skillet
- vegetarian option
- dinner
notes: Skip soy sauce, which is often high in histamine.
